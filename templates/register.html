{% extends "base.html" %}
{% block content %}
<h3>Регистрация</h3>
<form method="post" action="{{ url_for('auth.register') }}">
    <div class="mb-3">
        <label for="username" class="form-label">Имя пользователя</label>
        <input type="text" class="form-control" id="username" name="username" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <div class="mb-3">
        <label for="full_name" class="form-label">Полное имя (необязательно)</label>
        <input type="text" class="form-control" id="full_name" name="full_name">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email (необязательно)</label>
        <input type="email" class="form-control" id="email" name="email">
    </div>
    <div class="mb-3">
        <label for="role" class="form-label">Роль</label>
        <select class="form-select" id="role" name="role" onchange="togglePropertySelect()">
            <option value="owner">Арендодатель</option>
            <option value="tenant">Арендатор</option>
        </select>
    </div>
    <div class="mb-3" id="property_select_div" style="display:none;">
        <label for="property_id" class="form-label">Выберите объект</label>
        <select class="form-select" id="property_id" name="property_id">
            <option value="">-- выберите --</option>
            {% for p in properties %}
                <option value="{{ p.id }}">{{ p.address }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
</form>
<p class="mt-3">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войдите</a></p>
<script>
function togglePropertySelect() {
    const role = document.getElementById('role').value;
    const div = document.getElementById('property_select_div');
    if (role === 'tenant') {
        div.style.display = 'block';
    } else {
        div.style.display = 'none';
    }
}
document.addEventListener('DOMContentLoaded', togglePropertySelect);
</script>
{% endblock %}
