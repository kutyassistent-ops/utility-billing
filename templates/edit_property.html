{% extends "base.html" %}
{% block content %}
<h3>Редактирование объекта</h3>
<form method="post" action="{{ url_for('main.edit_property', property_id=prop.id) }}">
    <div class="mb-3">
        <label for="address" class="form-label">Адрес объекта</label>
        <input type="text" class="form-control" id="address" name="address" value="{{ prop.address }}" required>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="tariff_el" class="form-label">Тариф на электроэнергию (руб/кВт·ч)</label>
            <input type="number" step="0.01" class="form-control" id="tariff_el" name="tariff_el" value="{{ prop.tariff_el }}">
        </div>
        <div class="col-md-6 mb-3">
            <label for="tariff_water" class="form-label">Тариф на воду (руб/куб.м)</label>
            <input type="number" step="0.01" class="form-control" id="tariff_water" name="tariff_water" value="{{ prop.tariff_water }}">
        </div>
        <div class="col-md-6 mb-3">
            <label for="tariff_com1" class="form-label">Коммунальные услуги 1 (руб/куб.м ХВ)</label>
            <input type="number" step="0.01" class="form-control" id="tariff_com1" name="tariff_com1" value="{{ prop.tariff_com1 }}">
        </div>
        <div class="col-md-6 mb-3">
            <label for="tariff_com2" class="form-label">Коммунальные услуги 2 (руб/куб.м общий)</label>
            <input type="number" step="0.01" class="form-control" id="tariff_com2" name="tariff_com2" value="{{ prop.tariff_com2 }}">
        </div>
        <div class="col-md-6 mb-3">
            <label for="fixed_fee" class="form-label">Фиксированная плата (руб)</label>
            <input type="number" step="0.01" class="form-control" id="fixed_fee" name="fixed_fee" value="{{ prop.fixed_fee }}">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
