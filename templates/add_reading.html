{% extends "base.html" %}
{% block content %}
<h3>Ввод показаний</h3>
<form method="post" action="{{ url_for('main.add_reading') }}">
    <div class="mb-3">
        <label for="property_id" class="form-label">Объект</label>
        <select class="form-select" id="property_id" name="property_id" required>
            {% for p in properties %}
                <option value="{{ p.id }}">{{ p.address }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="date" class="form-label">Дата (оставьте пустым для сегодня)</label>
        <input type="date" class="form-control" id="date" name="date">
    </div>
    <div class="mb-3">
        <label for="hot_water" class="form-label">Горячая вода (куб.м)</label>
        <input type="number" class="form-control" id="hot_water" name="hot_water" required>
    </div>
    <div class="mb-3">
        <label for="cool_water" class="form-label">Холодная вода (куб.м)</label>
        <input type="number" class="form-control" id="cool_water" name="cool_water" required>
    </div>
    <div class="mb-3">
        <label for="electricity" class="form-label">Электроэнергия (кВт·ч)</label>
        <input type="number" class="form-control" id="electricity" name="electricity" required>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить и рассчитать</button>
</form>
{% endblock %}
