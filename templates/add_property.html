{% extends "base.html" %}
{% block content %}
<h3>Добавление объекта</h3>
<form method="post" action="{{ url_for('main.add_property') }}">
    <div class="mb-3">
        <label for="address" class="form-label">Адрес объекта</label>
        <input type="text" class="form-control" id="address" name="address" required>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="tariff_el" class="form-label">Тариф на электроэнергию (руб/кВт·ч)</label>
            <input type="number" step="0.01" class="form-control" id="tariff_el" name="tariff_el" value="2.73">
        </div>
        <div class="col-md-6 mb-3">
            <label for="tariff_water" class="form-label">Тариф на воду (руб/куб.м)</label>
            <input type="number" step="0.01" class="form-control" id="tariff_water" name="tariff_water" value="31.21">
        </div>
        <div class="col-md-6 mb-3">
            <label for="tariff_com1" class="form-label">Коммунальные услуги 1 (руб/куб.м ХВ)</label>
            <input type="number" step="0.01" class="form-control" id="tariff_com1" name="tariff_com1" value="72.83">
        </div>
        <div class="col-md-6 mb-3">
            <label for="tariff_com2" class="form-label">Коммунальные услуги 2 (руб/куб.м общий)</label>
            <input type="number" step="0.01" class="form-control" id="tariff_com2" name="tariff_com2" value="21.95">
        </div>
        <div class="col-md-6 mb-3">
            <label for="fixed_fee" class="form-label">Фиксированная плата (руб)</label>
            <input type="number" step="0.01" class="form-control" id="fixed_fee" name="fixed_fee" value="17000">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Создать объект</button>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
