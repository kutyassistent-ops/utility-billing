name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Проверка приложения
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Компиляция
        run: python -m compileall -q app.py auth.py config.py extensions.py models.py routes.py

      - name: Юнит-тесты
        run: python -m unittest discover -s tests -t . -v

      - name: Убедиться, что база данных не попала в репозиторий
        run: |
          if git ls-files | grep -E '\.db$'; then
            echo "::error::В репозитории есть файл базы данных"
            exit 1
          fi
          echo "Базы данных в репозитории нет"
